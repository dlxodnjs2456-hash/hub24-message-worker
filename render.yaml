services:
  - type: web
    name: hub24-message-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: hub24-session-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: HUB24_ENCRYPTION_KEY
        sync: false
      - key: HUB24_SUPABASE_URL
        sync: false
      - key: HUB24_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HUB24_CORS_ORIGINS
        sync: false
      - key: HUB24_TRONGRID_API_KEY
        sync: false
